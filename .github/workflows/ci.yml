# ── SentryPay — GitHub Actions CI/CD ─────────────────────────────────────────
#
# Runs on every push to main and every pull request.
# Three jobs:
#   1. lint      — code style checks (flake8)
#   2. unit-test — fast unit tests with mocked dependencies
#   3. deploy    — build and push to Cloud Run (main branch only)
#
# Required GitHub Secrets:
#   GCP_PROJECT_ID       — your GCP project ID
#   GCP_SA_KEY           — service account key JSON (base64 encoded)
#   ELASTIC_API_KEY      — Elastic API key
#   ELASTIC_ENDPOINT     — Elastic cluster URL
#   SENTRY_PAY_API_KEY   — SentryPay API key

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_REGION: us-central1
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/sentry-pay

jobs:

  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install flake8 flake8-bugbear

      - name: Run flake8
        run: |
          flake8 agent/ config/ setup/ data_pipeline/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=venv,__pycache__


  # ── Job 2: Unit tests ────────────────────────────────────────────────────────
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          # Mocked in tests — these are placeholders
          GCP_PROJECT_ID:    test-project
          ELASTIC_ENDPOINT:  https://test.elastic.co
          ELASTIC_API_KEY:   test-key
          SENTRY_PAY_API_KEY: test-api-key
          LANGFUSE_PUBLIC_KEY: test-pk
          LANGFUSE_SECRET_KEY: test-sk

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: pytest-report.xml
          retention-days: 7


  # ── Job 3: Build and deploy ──────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    # Only deploy on pushes to main (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy sentry-pay \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --timeout=300 \
            --memory=2Gi \
            --cpu=2 \
            --max-instances=3 \
            --allow-unauthenticated \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Get deployed URL
        run: |
          URL=$(gcloud run services describe sentry-pay \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)' \
            --project=${{ secrets.GCP_PROJECT_ID }})
          echo "Deployed to: $URL"
          echo "DEPLOYMENT_URL=$URL" >> $GITHUB_ENV

      - name: Health check
        run: |
          sleep 30
          curl -f "${{ env.DEPLOYMENT_URL }}/health" || exit 1
          echo "Health check passed"