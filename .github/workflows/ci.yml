# ── SentryPay — GitHub Actions CI/CD ─────────────────────────────────────────
#
# Runs on every push to main and every pull request.
#   1. lint      — code style checks (non-blocking)
#   2. unit-test — fast unit tests (skipped if no tests/)
#   3. deploy    — build and push to Cloud Run (main branch only)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_REGION: us-central1
  SERVICE_NAME: sentrypay
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/sentrypay

jobs:

  # ─── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install flake8 flake8-bugbear

      - name: Run flake8 (non-blocking)
        run: |
          flake8 agent/ config/ mcp_server/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501 \
            --exclude=venv,__pycache__ \
            || echo "::warning::Lint reported issues (non-blocking)"


  # ─── Job 2: Unit tests ──────────────────────────────────────────────────────
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    if: hashFiles('tests/**/test_*.py') != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          GCP_PROJECT_ID:      test-project
          ELASTIC_ENDPOINT:    https://test.elastic.co
          ELASTIC_API_KEY:     test-key
          SENTRY_PAY_API_KEY:  test-api-key
          LANGFUSE_PUBLIC_KEY: test-pk
          LANGFUSE_SECRET_KEY: test-sk
          JWT_SECRET:          test-jwt-secret


  # ─── Job 3: Build and deploy ────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build image with Cloud Build
        run: |
          gcloud builds submit \
            --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --timeout 20m \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            .

      - name: Tag as latest
        run: |
          gcloud container images add-tag \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:latest \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --quiet

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --port=8080 \
            --timeout=300 \
            --memory=2Gi \
            --cpu=2 \
            --concurrency=80 \
            --min-instances=0 \
            --max-instances=10 \
            --allow-unauthenticated \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars="GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},GCP_REGION=${{ env.GCP_REGION }},BIGQUERY_DATASET=sentry_pay,ELASTIC_ENDPOINT=${{ secrets.ELASTIC_ENDPOINT }},ELASTIC_API_KEY=${{ secrets.ELASTIC_API_KEY }},SENTRY_PAY_API_KEY=${{ secrets.SENTRY_PAY_API_KEY }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }},JWT_SECRET=${{ secrets.JWT_SECRET }},DEMO_USER_EMAIL=${{ secrets.DEMO_USER_EMAIL }},GMAIL_POLL_INTERVAL_SECONDS=300,VERTEX_EMBEDDING_MODEL=text-embedding-004,LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }},LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }},LANGFUSE_HOST=${{ secrets.LANGFUSE_HOST }}"

      - name: Get deployed URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)' \
            --project=${{ secrets.GCP_PROJECT_ID }})
          echo "Deployed to: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Smoke test (frontend)
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.get-url.outputs.url }}/")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Frontend smoke test failed with status $STATUS"
            exit 1
          fi
          echo "✓ Frontend responding"

      - name: Smoke test (demo auth)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ steps.get-url.outputs.url }}/auth/demo")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            echo "::error::Demo auth endpoint failed with status $STATUS"
            exit 1
          fi
          echo "✓ Demo auth endpoint reachable"

      - name: Deployment summary
        run: |
          echo "### 🚀 Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Public URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY