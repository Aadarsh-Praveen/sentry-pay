# ── SentryPay — Cloud Build Configuration ─────────────────────────────────────
#
# Triggered automatically on push to main branch.
# Builds Docker image, pushes to GCR, deploys to Cloud Run.
#
# Setup:
#   gcloud builds triggers create github \
#     --repo-name=sentry-pay \
#     --repo-owner=YOUR_GITHUB_USERNAME \
#     --branch-pattern=main \
#     --build-config=cloud-run/cloudbuild.yaml \
#     --project=sentry-pay

steps:
  # ── Step 1: Run regression tests ───────────────────────────────────────────
  - name: python:3.12-slim
    id: regression-tests
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt -q
        python agent/regression_tests.py
        if [ $? -ne 0 ]; then
          echo "Regression tests failed — aborting deployment"
          exit 1
        fi
    env:
      - ELASTIC_API_KEY=$_ELASTIC_API_KEY
      - ELASTIC_ENDPOINT=$_ELASTIC_ENDPOINT
      - GCP_PROJECT_ID=$PROJECT_ID
      - GCP_REGION=us-central1

  # ── Step 2: Build Docker image ──────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/sentry-pay:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/sentry-pay:latest
      - .

  # ── Step 3: Push to Container Registry ─────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/sentry-pay

  # ── Step 4: Deploy to Cloud Run ─────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - sentry-pay
      - --image=gcr.io/$PROJECT_ID/sentry-pay:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --timeout=300
      - --memory=2Gi
      - --cpu=2
      - --max-instances=3
      - --allow-unauthenticated

# Store images in Container Registry
images:
  - gcr.io/$PROJECT_ID/sentry-pay:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/sentry-pay:latest

# Build timeout
timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY